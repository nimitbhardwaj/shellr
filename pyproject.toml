[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shellr"
version = "0.2.0"
description = "Root-controlled Android phone from a VPS over Tailscale. HMAC-signed RPC, kernel-resident, no third-party apps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nimit Bhardwaj" }]
keywords = ["android", "root", "tailscale", "rpc", "daemon", "remote-control"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[project.scripts]
shellr = "shellr.cli.main:main"
shellrd = "shellr.daemon:main"

[project.urls]
Homepage = "https://github.com/yourname/shellr"
Repository = "https://github.com/yourname/shellr"

# ---------------------------------------------------------------------------
# setuptools-specific config
# ---------------------------------------------------------------------------

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["shellr*"]

[tool.setuptools.package-data]
"shellr" = ["py.typed"]
"shellr.daemon" = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/shellr"]
